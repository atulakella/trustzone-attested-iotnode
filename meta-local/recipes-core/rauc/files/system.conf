[system]
compatible=STM32MP157D-DK1-Capstone
bootloader=uboot
boot-attempts=3

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/mmcblk0p12
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p13
type=ext4
bootname=B

[slot.bootfs.0]
device=/dev/mmcblk0p8
type=ext4
parent=rootfs.0

[slot.bootfs.1]
device=/dev/mmcblk0p9
type=ext4
parent=rootfs.1

[slot.vendorfs.0]
device=/dev/mmcblk0p10
type=ext4
parent=rootfs.0

[slot.vendorfs.1]
device=/dev/mmcblk0p11
type=ext4
parent=rootfs.1
